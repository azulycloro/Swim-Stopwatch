<style>
/* --- mantengo la mayoría de estilos originales (recortado para brevedad en el ejemplo) --- */
* { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
body { display: flex; height: 100vh; background-color: #f0f4f8; overflow: hidden; touch-action: manipulation; }
#main-container { flex: 1; display: flex; flex-direction: column; height: 100%; overflow: hidden; }
#app-header { background: #fff; padding: 8px 12px; display:flex; align-items:center; gap:8px; border-bottom:2px solid #ccc; box-shadow: 0 2px 5px rgba(0,0,0,0.05); overflow-x:auto; white-space:nowrap; z-index:500; }
.header-btn { padding: 10px; font-weight: bold; font-size: 15px; cursor: pointer; border: 1px solid #999; border-radius: 8px; background: #fff; }
.heat-container { display:flex; gap:6px; align-items:center; background:#e8eaf6; padding:6px 10px; border-radius:8px; border:1px solid #c5cae9; flex-shrink:0; }

#center-split-wrapper { display:flex; flex:1; overflow:hidden; position:relative; }

.modal.open { display:flex; }

/* responsive */

  #big-button-container { width:110px; }
  #big-button-label { font-size:24px; }

<script>
/* ---------------------------
   App: mejorada y modular
   --------------------------- */

/* ---- Estado global (un único objeto) ---- */
const App = {
  db: null,
  DB_NAME: 'SwimStopwatchDB',
  DB_VERSION: 2,
  heatsData: {},
  currentHeatId: 1,
  totalHeatsCount: 1,
  activeLanes: 6,
  tournamentName: 'Copa_Nal_Interclubes',
  sessionType: 'Eliminatorias',
  coachName: 'Juan Albarracin',
  googleWebAppUrl: '',
  cardIdCounter: 0,
  saveTimeout: null,
  saveDelayMs: 1000, // debounce interval
  timerRAF: null,
  timerWorker: null,
  timerWorkerUrl: null,
  lastRenderTs: 0
};

/* ---- Utils: modales no bloqueantes ---- */
let confirmResolver = null;
function showConfirm(title, message) {
  return new Promise(resolve => {
    const m = document.getElementById('confirm-modal');
    document.getElementById('confirm-title').innerText = title || 'Confirmar';
    document.getElementById('confirm-msg').innerText = message || '';
    m.classList.add('open'); m.setAttribute('aria-hidden','false');
    confirmResolver = (val) => { m.classList.remove('open'); m.setAttribute('aria-hidden','true'); resolve(val); confirmResolver = null; };
  });
}
function resolveConfirm(val) { if (confirmResolver) confirmResolver(val); }

function showAlert(title, message) {
  const m = document.getElementById('alert-modal');
  document.getElementById('alert-title').innerText = title || 'Atención';
  document.getElementById('alert-msg').innerText = message || '';
  m.classList.add('open'); m.setAttribute('aria-hidden','false');
}
function closeAlertModal() { const m = document.getElementById('alert-modal'); m.classList.remove('open'); m.setAttribute('aria-hidden','true'); }

/* ---- IndexedDB init / helpers ---- */
function initIndexedDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(App.DB_NAME, App.DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('sessions')) {
        db.createObjectStore('sessions', { keyPath: 'id' });
      }
      if (!db.objectStoreNames.contains('outbox')) {
        db.createObjectStore('outbox', { keyPath: 'id', autoIncrement: true });
      }
    };
    req.onsuccess = (e) => { App.db = e.target.result; resolve(App.db); };
    req.onerror = (e) => reject(e.target.error);
  });
}

function saveStateToIDB(stateObj) {
  if (!App.db) return Promise.resolve();
  return new Promise((resolve, reject) => {
    try {
      const tx = App.db.transaction(['sessions'], 'readwrite');
      const store = tx.objectStore('sessions');
      stateObj.id = 'current_session';
      const req = store.put(stateObj);
      req.onsuccess = () => resolve();
      req.onerror = (e) => reject(e.target.error);
    } catch (err) {
      reject(err);
    }
  });
}

function loadStateFromIDB() {
  if (!App.db) return Promise.resolve(null);
  return new Promise((resolve, reject) => {
    const tx = App.db.transaction(['sessions'], 'readonly');
    const store = tx.objectStore('sessions');
    const req = store.get('current_session');
    req.onsuccess = (e) => resolve(e.target.result);
    req.onerror = (e) => reject(e.target.error);
  });
}

/* ---- Outbox: add & process with retry/backoff ---- */
function addToOutbox(payload) {
  if (!App.db) return Promise.resolve();
  return new Promise((resolve, reject) => {
    try {
      const tx = App.db.transaction(['outbox'], 'readwrite');
      const store = tx.objectStore('outbox');
      const entry = { payload, timestamp: Date.now(), retryCount: 0, nextAttempt: Date.now() };
      const req = store.add(entry);
      req.onsuccess = () => {
        resolve();
        processOutbox(); // kick
      };
      req.onerror = (e) => reject(e.target.error);
    } catch (err) {
      reject(err);
    }
  });
}

async function processOutbox() {
  if (!App.db || !navigator.onLine || !App.googleWebAppUrl) return;
  if (!/^https?:\/\//i.test(App.googleWebAppUrl)) {
    console.warn('Outbox: URL no válida, espera configuración con https://');
    return;
  }
  const tx = App.db.transaction(['outbox'], 'readwrite');
  const store = tx.objectStore('outbox');
  const req = store.openCursor();
  req.onsuccess = async (e) => {
    const cursor = e.target.result;
    if (!cursor) return;
    const item = cursor.value;
    const now = Date.now();
    if (item.nextAttempt && item.nextAttempt > now) {
      // skip until nextAttempt
      return;
    }
    try {
      const res = await fetch(App.googleWebAppUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(item.payload)
      });
      if (res && (res.ok || res.status === 0)) { // some environments return 0 for opaque; with CORS enabled server should return ok
        cursor.delete();
        const ind = document.getElementById('save-status-indicator');
        if (ind) ind.innerText = "✓ Sincronizado con la nube (Outbox OK)";
        // continue with next
        processOutbox();
      } else {
        // server error
        item.retryCount = (item.retryCount || 0) + 1;
        item.nextAttempt = Date.now() + Math.min(60 * 60 * 1000, Math.pow(2, item.retryCount) * 1000); // exp backoff up to 1h
        cursor.update(item);
        console.warn('Outbox: servidor devolvió error', res && res.status);
      }
    } catch (err) {
      // network / CORS
      item.retryCount = (item.retryCount || 0) + 1;
      item.nextAttempt = Date.now() + Math.min(60 * 60 * 1000, Math.pow(2, item.retryCount) * 1000);
      cursor.update(item);
      console.warn('Outbox: fallo de red/CORS - reintentaremos', err);
    }
  };
  req.onerror = (e) => console.error('Outbox cursor error', e);
}

/* -- Autosave debounce to avoid transaction conflicts -- */
function scheduleAutoSave() {
  if (App.saveTimeout) clearTimeout(App.saveTimeout);
  App.saveTimeout = setTimeout(() => {
    autoSaveToStorage();
    App.saveTimeout = null;
  }, App.saveDelayMs);
}

/* ---- Formatting ---- */
function formatTime(ms) {
  if (!ms && ms !== 0) return '00:00.00';
  const total = Math.max(0, Math.floor(ms));
  const minutes = Math.floor(total / 60000);
  const seconds = Math.floor((total % 60000) / 1000);
  const centis = Math.floor((total % 1000) / 10);
  return `${String(minutes).padStart(2,'0')}:${String(seconds).padStart(2,'0')}.${String(centis).padStart(2,'0')}`;
}

/* ---- Heat data model helpers ---- */
function createEmptyHeatState(defaultName, initialSplits = 4) {
  const lanes = [];
  for (let i = 0; i < App.activeLanes; i++) {
    lanes.push({
      lane: i + 1,
      swimmerName: '',
      seedTime: '',
      splits: Array(initialSplits).fill(null),
      officialTime: '',
    });
  }
  return {
    name: defaultName,
    activeSplits: initialSplits,
    isRunning: false,
    startPerfNow: null, // performance.now() when started
    elapsedTime: 0,
    cards: [],
    laneData: lanes,
    hiddenLanes: [],
    attachedPhotos: [] // {name, blob, previewUrl}
  };
}

/* ---- Core timer using performance.now + rAF (preciso y eficiente) ---- */
function startPerfTimerForHeat(h) {
  if (!h) return;
  if (h.isRunning) return;
  h.isRunning = true;
  h.startPerfNow = performance.now();
  if (!App.timerRAF) {
    App.timerRAF = requestAnimationFrame(timerTick);
  }
  updateBigButtonLabel();
}

function pausePerfTimerForHeat(h) {
  if (!h || !h.isRunning) return;
  h.isRunning = false;
  if (h.startPerfNow != null) {
    h.elapsedTime += performance.now() - h.startPerfNow;
    h.startPerfNow = null;
  }
  if (App.timerRAF) {
    cancelAnimationFrame(App.timerRAF);
    App.timerRAF = null;
  }
  updateClock(); // final snapshot
  updateBigButtonLabel();
  scheduleAutoSave();
}

function getHeatElapsedMs(h) {
  if (!h) return 0;
  if (h.isRunning && h.startPerfNow != null) {
    return h.elapsedTime + (performance.now() - h.startPerfNow);
  }
  return h.elapsedTime;
}

function timerTick(ts) {
  const now = performance.now();
  // throttle UI updates to ~50ms to reduce repaints
  if (now - (App.lastRenderTs || 0) >= 50) {
    updateClock();
    App.lastRenderTs = now;
  }
  App.timerRAF = requestAnimationFrame(timerTick);
}

/* ---- UI: render heat select, lanes, photos ---- */
function renderHeatSelectOptions() {
  const sel = document.getElementById('heat-select');
  sel.innerHTML = '';
  const ids = Object.keys(App.heatsData).map(k => parseInt(k, 10)).sort((a,b)=>a-b);
  ids.forEach(id => {
    const opt = document.createElement('option');
    opt.value = id;
    opt.textContent = `${id} - ${App.heatsData[id].name || 'Prueba ' + id}`;
    sel.appendChild(opt);
  });
}

function renderLanes() {
  const container = document.getElementById('lanes-container');
  container.innerHTML = '';
  const heat = App.heatsData[App.currentHeatId];
  if (!heat) return;
  heat.laneData.forEach((laneObj, idx) => {
    const row = document.createElement('div');
    row.className = 'lane-row';
    const header = document.createElement('div');
    header.className = 'lane-header';
    header.innerHTML = `<div>Lane ${laneObj.lane}</div><div style="font-size:10px">${laneObj.swimmerName || ''}</div>`;
    row.appendChild(header);

    const splitsWrap = document.createElement('div');
    splitsWrap.className = 'splits-row';
    for (let s = 0; s < (heat.activeSplits || 4); s++) {
      const cell = document.createElement('div');
      cell.className = 'split-cell';
      cell.innerHTML = `<div style="font-size:10px;color:#9e9e9e">Split ${s+1}</div>
        <div style="font-family:monospace;font-weight:bold">${laneObj.splits[s] ? formatTime(laneObj.splits[s]) : '--:--.--'}</div>`;
      splitsWrap.appendChild(cell);
    }
    row.appendChild(splitsWrap);

    const totalBox = document.createElement('div');
    totalBox.className = 'total-time-container';
    totalBox.style.marginLeft = 'auto';
    totalBox.innerHTML = `<div class="total-label">Total</div><div class="total-display">${laneObj.officialTime || '--:--.--'}</div>`;
    row.appendChild(totalBox);

    container.appendChild(row);
  });
  updateClock();
}

function renderPhotoFooter() {
  const panel = document.getElementById('photo-footer-panel');
  panel.innerHTML = '';
  const heat = App.heatsData[App.currentHeatId];
  if (!heat || !heat.attachedPhotos) return;
  heat.attachedPhotos.forEach((p, i) => {
    const item = document.createElement('div');
    item.style.display = 'flex'; item.style.gap = '8px'; item.style.alignItems = 'center';
    const thumb = document.createElement('img');
    thumb.className = 'footer-photo-thumb';
    thumb.src = p.previewUrl || '';
    thumb.alt = p.name || `Foto ${i+1}`;
    thumb.onclick = () => openPhotoModal(i);
    item.appendChild(thumb);
    const details = document.createElement('div');
    details.style.display='flex'; details.style.flexDirection='column'; details.style.gap='2px';
    details.innerHTML = `<div style="font-weight:bold;color:#4a148c">${p.name || 'Foto'}</div><div style="font-family:monospace;font-size:11px;color:#666">${p.blob ? Math.round(p.blob.size/1024) + ' KB' : ''}</div>`;
    item.appendChild(details);
    const actions = document.createElement('div'); actions.style.marginLeft='auto';
    const delBtn = document.createElement('button'); delBtn.className='header-btn'; delBtn.textContent='Eliminar';
    delBtn.onclick = async () => {
      const ok = await showConfirm('Eliminar foto', '¿Deseas eliminar esta foto?');
      if (!ok) return;
      // revoke preview URL
      try { if (p.previewUrl) URL.revokeObjectURL(p.previewUrl); } catch(e){}
      heat.attachedPhotos.splice(i,1);
      renderPhotoFooter();
      scheduleAutoSave();
    };
    actions.appendChild(delBtn);
    item.appendChild(actions);
    panel.appendChild(item);
  });
}

/* ---- Photos: handle input, store blobs in heatsData (IndexedDB supports blobs) ---- */
function triggerCameraInput() { document.getElementById('camera-file-input').click(); }

function handlePhotoSelect(ev) {
  const file = ev.target.files && ev.target.files[0];
  if (!file) return;
  const heat = App.heatsData[App.currentHeatId];
  if (!heat) return;
  if (!heat.attachedPhotos) heat.attachedPhotos = [];
  if (heat.attachedPhotos.length >= 6) {
    showAlert('Límite alcanzado', 'Número máximo de fotos alcanzado para esta prueba (6).');
    return;
  }
  const preview = URL.createObjectURL(file);
  heat.attachedPhotos.push({ name: file.name || `Foto_${Date.now()}`, blob: file, previewUrl: preview });
  renderPhotoFooter();
  scheduleAutoSave();
  // clear input for further picks
  ev.target.value = '';
}

/* ---- Photo modal preview ---- */
let activePhotoIndex = null;
function openPhotoModal(index) {
  activePhotoIndex = index;
  const heat = App.heatsData[App.currentHeatId];
  if (!heat || !heat.attachedPhotos[index]) return;
  const img = document.getElementById('full-image-preview');
  img.src = heat.attachedPhotos[index].previewUrl;
  document.getElementById('image-modal').classList.add('open');
}
function closePhotoModal() { document.getElementById('image-modal').classList.remove('open'); }
function downloadPhotoModalActive() {
  const heat = App.heatsData[App.currentHeatId];
  if (!heat || activePhotoIndex == null) return;
  const p = heat.attachedPhotos[activePhotoIndex];
  if (!p || !p.blob) return;
  const url = URL.createObjectURL(p.blob);
  const a = document.createElement('a');
  a.href = url; a.download = p.name || 'photo.jpg'; document.body.appendChild(a); a.click();
  setTimeout(()=>{ try{ URL.revokeObjectURL(url); }catch(e){} document.body.removeChild(a); }, 15000);
}

/* ---- Save / Load state (debounced + onbeforeunload) ---- */
function saveCurrentHeatState() {
  // ensure optional fields exist
  const heat = App.heatsData[App.currentHeatId];
  if (!heat) return;
}

/* Compose minimal serializable state (blobs are ok in IDB) */
async function autoSaveToStorage() {
  try {
    saveCurrentHeatState();
    const stateToSave = {
      tournamentName: App.tournamentName,
      sessionType: App.sessionType,
      coachName: App.coachName,
      googleWebAppUrl: App.googleWebAppUrl,
      heatsData: App.heatsData,
      currentHeatId: App.currentHeatId,
      totalHeatsCount: App.totalHeatsCount,
      activeLanes: App.activeLanes,
      cardIdCounter: App.cardIdCounter,
      exportedAt: new Date().toISOString()
    };
    await saveStateToIDB(stateToSave);
    const ind = document.getElementById('save-status-indicator');
    if (ind && !ind.innerText.includes('☁️')) {
      ind.innerText = '✓ Guardado local IndexedDB (OK)';
      setTimeout(()=>{ if (!ind.innerText.includes('☁️')) ind.innerText = '✓ Sincronización Offline-First activa'; }, 1500);
    }
  } catch (err) {
    console.warn('Error guardando en IDB', err);
  }
}

/* ---- Export session: produce JSON, create download, revoke later ---- */
function exportSessionJSON() {
  saveCurrentHeatState();
  const stateToExport = {
    tournamentName: App.tournamentName,
    sessionType: App.sessionType,
    coachName: App.coachName,
    heatsData: App.heatsData,
    currentHeatId: App.currentHeatId,
    totalHeatsCount: App.totalHeatsCount,
    activeLanes: App.activeLanes,
    cardIdCounter: App.cardIdCounter,
    exportedAt: new Date().toISOString()
  };
  const json = JSON.stringify(stateToExport, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = `${getFormattedTournamentLabel()}_Respaldo.json`;
  document.body.appendChild(link);
  link.click();
  setTimeout(()=>{ try{ URL.revokeObjectURL(url); }catch(e){} try{ document.body.removeChild(link);}catch(e){} }, 15000);
}

/* ---- Import session JSON ---- */
function triggerImportSession() { document.getElementById('session-file-input').click(); }
function importSessionJSON(e) {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const fr = new FileReader();
  fr.onload = async (ev) => {
    try {
      const parsed = JSON.parse(ev.target.result);
      if (!parsed.heatsData) {
        showAlert('Archivo inválido', 'El archivo no contiene heatsData.');
        return;
      }
      const ok = await showConfirm('Reemplazar sesión', '¿Deseas reemplazar la sesión actual con los datos cargados?');
      if (!ok) return;
      App.heatsData = parsed.heatsData;
      App.currentHeatId = parsed.currentHeatId || 1;
      App.totalHeatsCount = parsed.totalHeatsCount || Object.keys(App.heatsData).length;
      App.activeLanes = parsed.activeLanes || App.activeLanes;
      App.tournamentName = parsed.tournamentName || App.tournamentName;
      App.sessionType = parsed.sessionType || App.sessionType;
      App.coachName = parsed.coachName || App.coachName;
      App.cardIdCounter = parsed.cardIdCounter || App.cardIdCounter;
      // ensure arrays exist
      for (let k in App.heatsData) {
        const h = App.heatsData[k];
        if (!h.hiddenLanes) h.hiddenLanes = [];
        if (!h.attachedPhotos) h.attachedPhotos = [];
      }
      renderHeatSelectOptions();
      document.getElementById('heat-select').value = App.currentHeatId;
      loadHeatState(App.currentHeatId);
      scheduleAutoSave();
      showAlert('Éxito', '¡Sesión cargada con éxito!');
    } catch (err) {
      console.error(err);
      showAlert('Error', 'No se pudo leer el archivo JSON de sesión.');
    }
  };
  fr.readAsText(file);
  e.target.value = '';
}

/* ---- Sync to Google Sheets (Outbox) ---- */
function syncToGoogleSheet() {
  if (!App.googleWebAppUrl) {
    showAlert('Configurar URL', 'Por favor configura la URL del Web App en Ajustes.');
    openSettings();
    return;
  }
  saveCurrentHeatState();
  const payload = { tournamentName: App.tournamentName, sessionType: App.sessionType, coachName: App.coachName, heats: App.heatsData };
  const ind = document.getElementById('save-status-indicator');
  if (ind) ind.innerText = '☁️ Añadiendo a Outbox y sincronizando...';
  addToOutbox(payload).then(()=> {
    if (ind) ind.innerText = '✓ Encolado y sincronizado con Google Sheets';
    showAlert('Encolado', 'Datos encolados y sincronización iniciada.');
  }).catch(err => {
    console.error('Outbox add error', err);
    if (ind) ind.innerText = '⚠️ Error al encolar';
    showAlert('Error', 'No se pudo encolar para sincronización.');
  });
}

/* ---- Heat navigation / management ---- */
function addHeat() {
  saveCurrentHeatState();
  App.totalHeatsCount++;
  const lastHeat = App.heatsData[App.totalHeatsCount - 1];
  const spl = lastHeat ? lastHeat.activeSplits : 4;
  App.currentHeatId = App.totalHeatsCount;
  App.heatsData[App.currentHeatId] = createEmptyHeatState(`Prueba ${App.totalHeatsCount}`, spl);
  renderHeatSelectOptions();
  document.getElementById('heat-select').value = App.currentHeatId;
  loadHeatState(App.currentHeatId);
  scheduleAutoSave();
}

async function deleteCurrentHeat() {
  const keys = Object.keys(App.heatsData);
  if (keys.length <= 1) {
    showAlert('Operación no permitida', 'No puedes eliminar la única prueba existente.');
    return;
  }
  const h = App.heatsData[App.currentHeatId];
  if (!h) return;
  const ok = await showConfirm('Eliminar prueba', `¿Estás seguro de eliminar la prueba "${h.name}"?`);
  if (!ok) return;
  // revoke photo urls
  if (h.attachedPhotos) {
    h.attachedPhotos.forEach(p => { try{ if (p.previewUrl) URL.revokeObjectURL(p.previewUrl); }catch(e){} });
  }
  delete App.heatsData[App.currentHeatId];
  const remainingKeys = Object.keys(App.heatsData).map(k => parseInt(k,10)).sort((a,b)=>a-b);
  App.currentHeatId = remainingKeys[0];
  renderHeatSelectOptions();
  document.getElementById('heat-select').value = App.currentHeatId;
  loadHeatState(App.currentHeatId);
  scheduleAutoSave();
}

function renameCurrentHeat() {
  const h = App.heatsData[App.currentHeatId];
  if (!h) return;
  const newName = prompt('Ingresa el nuevo nombre para esta serie/prueba:', h.name);
  if (newName && newName.trim()) {
    h.name = newName.trim();
    renderHeatSelectOptions();
    loadHeatState(App.currentHeatId);
    scheduleAutoSave();
  }
}

function switchHeat(val) {
  const newId = parseInt(val,10);
  if (!newId || newId === App.currentHeatId) return;
  saveCurrentHeatState();
  App.currentHeatId = newId;
  loadHeatState(App.currentHeatId);
  scheduleAutoSave();
}

function goToPreviousHeat() {
  saveCurrentHeatState();
  const ids = Object.keys(App.heatsData).map(k=>parseInt(k,10)).sort((a,b)=>a-b);
  const idx = ids.indexOf(App.currentHeatId);
  App.currentHeatId = idx > 0 ? ids[idx - 1] : ids[ids.length - 1];
  renderHeatSelectOptions();
  document.getElementById('heat-select').value = App.currentHeatId;
  loadHeatState(App.currentHeatId);
  scheduleAutoSave();
}

function goToNextTargetHeat() {
  // Select next heat that is not having times or next logical
  const ids = Object.keys(App.heatsData).map(k=>parseInt(k,10)).sort((a,b)=>a-b);
  const idx = ids.indexOf(App.currentHeatId);
  let next = ids[(idx + 1) % ids.length];
  App.currentHeatId = next;
  renderHeatSelectOptions();
  document.getElementById('heat-select').value = App.currentHeatId;
  loadHeatState(App.currentHeatId);
  scheduleAutoSave();
}

/* ---- Load heat state to UI ---- */
function loadHeatState(id) {
  const heat = App.heatsData[id];
  if (!heat) return;
  document.getElementById('input-lanes') && (document.getElementById('input-lanes').value = App.activeLanes);
  document.getElementById('input-tournament-name') && (document.getElementById('input-tournament-name').value = App.tournamentName);
  document.getElementById('input-session-type') && (document.getElementById('input-session-type').value = App.sessionType);
  renderLanes();
  renderPhotoFooter();
  updateMetaDisplays();
  updateBigButtonLabel();
}

/* ---- Clock UI update ---- */
function updateClock() {
  const h = App.heatsData[App.currentHeatId];
  const ms = getHeatElapsedMs(h);
  const el = document.getElementById('clock-display');
  if (el) el.innerText = formatTime(ms);
}

/* ---- Big button behavior: toggle start/pause ---- */
function handleBigButtonClick() {
  const h = App.heatsData[App.currentHeatId];
  if (!h) return;
  if (h.isRunning) {
    pausePerfTimerForHeat(h);
  } else {
    startPerfTimerForHeat(h);
  }
  scheduleAutoSave();
}

/* ---- Stop behavior (stop & snapshot) ---- */
function stopClock() {
  const h = App.heatsData[App.currentHeatId];
  if (!h) return;
  if (h.isRunning) pausePerfTimerForHeat(h);
  // optionally compute finalization tasks (e.g., assign official time) -- left to user action
  scheduleAutoSave();
  showAlert('Detenido', 'Cronómetro detenido y guardado.');
}

/* ---- Settings handlers ---- */
function openSettings() { document.getElementById('settings-modal').classList.add('open'); }
function closeSettings() { document.getElementById('settings-modal').classList.remove('open'); }
function saveSettings() {
  App.coachName = document.getElementById('input-coach').value.trim() || App.coachName;
  App.googleWebAppUrl = document.getElementById('input-webapp-url').value.trim() || App.googleWebAppUrl;
  const newActive = parseInt(document.getElementById('input-lanes').value,10) || App.activeLanes;
  const newSplits = parseInt(document.getElementById('input-splits').value,10) || 4;
  App.activeLanes = newActive;
  // update heats to match lanes/splits
  for (let hid in App.heatsData) {
    const heat = App.heatsData[hid];
    heat.activeSplits = newSplits;
    while (heat.laneData.length < App.activeLanes) {
      heat.laneData.push({ lane: heat.laneData.length + 1, swimmerName:'', seedTime:'', splits: Array(newSplits).fill(null), officialTime:''});
    }
    heat.laneData = heat.laneData.slice(0, App.activeLanes);
    heat.laneData.forEach(l => { while (l.splits.length < newSplits) l.splits.push(null); if (l.splits.length > newSplits) l.splits = l.splits.slice(0, newSplits); });
  }
  updateMetaDisplays();
  renderLanes();
  closeSettings();
  scheduleAutoSave();
  showAlert('Ajustes', 'Ajustes guardados con éxito.');
}

/* ---- Meta display helper ---- */
function getFormattedTournamentLabel() {
  const now = new Date();
  const dd = String(now.getDate()).padStart(2,'0');
  const mm = String(now.getMonth() + 1).padStart(2,'0');
  const yy = String(now.getFullYear()).slice(-2);
  return `${App.tournamentName}_${App.sessionType}_${dd}${mm}${yy}`;
}
function updateMetaDisplays() {
  document.getElementById('tournament-meta-display').innerText = getFormattedTournamentLabel();
  document.getElementById('coach-name-display').innerText = App.coachName;
}

/* ---- Clear data with confirm ---- */
async function confirmClearData() {
  const ok = await showConfirm('Borrar datos', '¿Estás seguro de borrar todos los datos locales? Esta acción no se puede deshacer.');
  if (!ok) return;
  clearLocalStorage();
}
function clearLocalStorage() {
  if (!App.db) { location.reload(); return; }
  try {
    const tx = App.db.transaction(['sessions','outbox'], 'readwrite');
    const s1 = tx.objectStore('sessions'); const s2 = tx.objectStore('outbox');
    s1.clear(); s2.clear();
    tx.oncomplete = () => {
      // revoke photo preview URLs
      for (let k in App.heatsData) {
        const h = App.heatsData[k];
        if (h && h.attachedPhotos) h.attachedPhotos.forEach(p => { try{ if (p.previewUrl) URL.revokeObjectURL(p.previewUrl);}catch(e){} });
      }
      App.heatsData = { 1: createEmptyHeatState('Prueba 1', 4) };
      App.currentHeatId = 1;
      App.totalHeatsCount = 1;
      scheduleAutoSave();
      location.reload();
    };
    tx.onerror = (e) => { console.error('Error limpiando IDB', e); location.reload(); };
  } catch (err) {
    console.error('Error general limpiando', err); location.reload();
  }
}

/* ---- Keyboard shortcuts ---- */
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    e.preventDefault();
    handleBigButtonClick();
  } else if (e.key === 's' || e.key === 'S') {
    stopClock();
  } else if (e.key === 'ArrowLeft') {
    goToPreviousHeat();
  } else if (e.key === 'ArrowRight') {
    goToNextTargetHeat();
  }
});

/* ---- App init / teardown ---- */
async function initApp() {
  try {
    await initIndexedDB();
  } catch (err) {
    console.error('Fallo al iniciar IndexedDB', err);
  }

  // default initial data if none saved
  const saved = await loadStateFromIDB();
  if (saved && saved.heatsData) {
    try {
      App.heatsData = saved.heatsData;
      App.currentHeatId = saved.currentHeatId || 1;
      App.totalHeatsCount = saved.totalHeatsCount || Object.keys(App.heatsData).length;
      App.activeLanes = saved.activeLanes || App.activeLanes;
      App.tournamentName = saved.tournamentName || App.tournamentName;
      App.sessionType = saved.sessionType || App.sessionType;
      App.coachName = saved.coachName || App.coachName;
      App.googleWebAppUrl = saved.googleWebAppUrl || App.googleWebAppUrl;
      App.cardIdCounter = saved.cardIdCounter || App.cardIdCounter;
      // ensure arrays
      for (let k in App.heatsData) {
        const h = App.heatsData[k];
        if (!h.hiddenLanes) h.hiddenLanes = [];
        if (!h.attachedPhotos) h.attachedPhotos = [];
      }
    } catch (e) {
      console.error('Error procesando estado desde IDB', e);
    }
  } else {
    App.heatsData = { 1: createEmptyHeatState('Prueba 1', 4) };
    App.currentHeatId = 1;
    App.totalHeatsCount = 1;
  }

  // render UI
  renderHeatSelectOptions();
  document.getElementById('heat-select').value = App.currentHeatId;
  loadHeatState(App.currentHeatId);

  // wire up simple events (buttons that open/close modals)
  document.getElementById('file-btn').onclick = openFileModal;
  document.getElementById('big-button-container').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') handleBigButtonClick();
  });

  // process outbox if online
  if (navigator.onLine) processOutbox();
  window.addEventListener('online', () => {
    const ind = document.getElementById('save-status-indicator');
    if (ind) ind.innerText = '🌐 Conectado - Sincronizando cola Outbox...';
    processOutbox();
  });
  window.addEventListener('offline', () => {
    const ind = document.getElementById('save-status-indicator');
    if (ind) ind.innerText = '💾 Modo Offline (Guardando en IndexedDB)';
  });

  // visibility change auto-save
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) scheduleAutoSave();
  });

  // ensure save on exit
  window.addEventListener('beforeunload', (ev) => {
    // final synchronous save is not reliably available. Try to use navigator.sendBeacon for minimal payload.
    try { scheduleAutoSave(); } catch(e){}
  });
}
